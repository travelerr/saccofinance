version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.23.4
        - nvm use 22.23.4
        - node scripts/check-node-version.cjs
        - npm ci
    build:
      commands:
        - node scripts/prepare-amplify-env.cjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
