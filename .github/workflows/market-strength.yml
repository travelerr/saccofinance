name: Refresh market strength

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh ETF snapshot
        run: python3 scripts/refresh-market-strength.py
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/market-strength/latest.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-strength/latest.json
          git commit -m "Refresh market strength snapshot"
          git push
